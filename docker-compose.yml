version: '3.4'
services:
  lightning.avado.dnp.dappnode.eth:
    image: 'lightning.avado.dnp.dappnode.eth:0.1.0'
    build:
      context: .
      dockerfile: build/Dockerfile
    volumes:
      - 'lightning:/data'
    ports:
      - '9735:9735'
      - '8080:8080'
    environment:
      - ALIAS=AVADO
    restart: always
volumes:
  lightning: {}
